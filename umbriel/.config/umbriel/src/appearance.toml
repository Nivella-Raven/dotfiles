[colors]
background = "#141419FF"
text_primary = "#E8E8EAFF"
text_muted = "#8A8A92FF"
accent_primary = "#89B4FAFF"
accent_secondary = "#F9E2AFFF"
warning = "#F9E2AFFF"
error = "#F38BA8FF"
insert_hint = "#89DCEB80"
backdrop = "#000000FF"
shadow = "#0000007F"

[colors.border]
focused = "#89B4FAFF"
unfocused = "#45475AFF"
outer = "#1E1E2EFF"

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2

[appearance.tab_bar]
style = "titles"
position = "top"
height = 24
font = "sans 10"
padding = 8
tab_gap = 2
gap = -1
corner_radius = -1
visible = true
hide_when_single = false
max_tabs = 6
overflow = "scroll"
